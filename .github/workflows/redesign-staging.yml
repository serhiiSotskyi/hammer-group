name: Redesign staging (Static Web App)

# Deploys the combined site to the separate staging Static Web App (hg-redesign, new.hammergroup.ua):
#   /             new public site (apps/redesign-lab)
#   /admin/*      existing admin SPA (apps/frontend), assets under /admin-app/
# Runs only for the `redesign` branch — it never touches the live site (hg-frontend).
on:
  push:
    branches:
      - redesign
    paths:
      - "apps/redesign-lab/**"
      - "apps/frontend/**"
      - "scripts/build-site.sh"
      - ".github/workflows/redesign-staging.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy redesign staging
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/redesign-lab/package-lock.json
            apps/frontend/package-lock.json

      - name: Install (redesign-lab)
        run: npm ci
        working-directory: apps/redesign-lab

      - name: Install (frontend / admin)
        run: npm ci
        working-directory: apps/frontend

      - name: Build combined site (staging)
        run: bash scripts/build-site.sh staging
        env:
          VITE_API_ORIGIN: https://hg-backend-d3habycebefnf8ex.polandcentral-01.azurewebsites.net

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_REDESIGN }}
          action: "upload"
          app_location: "apps/redesign-lab/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
